<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Slendytubbies 3 WebGL</title>
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #unity-container {
        width: 100vw !important;
        height: 100vh !important;
        position: absolute;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
      #loading-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        font-size: 48px;
        font-family: sans-serif;
        text-align: center;
        z-index: 10;
        background: linear-gradient(
          270deg,
          #ff0000,
          #ff7f00,
          #ffff00,
          #00ff00,
          #0000ff,
          #4b0082,
          #8f00ff
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }

      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING... 0%</div>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock = screen.orientation.lock || function() { return Promise.resolve(); };
      }

      var canvas = document.querySelector("#unity-canvas");
      var loadingText = document.querySelector("#loading-text");
      var GITHUB_PAGES_BASE = "https://nobrowebport.github.io/S3OnlinePort/";

      var script = document.createElement("script");
      script.src = GITHUB_PAGES_BASE + "S3WebGL.loader.js";
      script.onload = () => {
        var config = {
          dataUrl: "https://media.githubusercontent.com/media/nobrowebport/S3OnlinePort/main/S3WebGL.data",
          frameworkUrl: GITHUB_PAGES_BASE + "S3WebGL.framework.js",
          codeUrl: GITHUB_PAGES_BASE + "S3WebGL.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "S3WebGL",
          productVersion: "1.0",
        };

        createUnityInstance(canvas, config, function(progress) {
          var percentage = Math.round(progress * 100);
          loadingText.textContent = "LOADING... " + percentage + "%";
        }).then(function(unityInstance) {
          loadingText.remove();
        }).catch(function(message) {
          console.error(message);
          loadingText.textContent = "FAILED TO LOAD";
        });
      };
      script.onerror = () => {
        loadingText.textContent = "FAILED TO LOAD LOADER SCRIPT";
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
