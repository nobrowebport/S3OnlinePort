<!DOCTYPE html>
<html lang="en-us">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slendytubbies 3 WebGL</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000
}

#unity-container{
position:fixed;
inset:0;
width:100vw;
height:100vh;
background:#000
}

#unity-canvas{
display:block;
width:100%!important;
height:100%!important;
background:#000
}

#loading-text{
position:fixed;
z-index:9999;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-family:Arial,Helvetica,sans-serif;
font-size:48px;
font-weight:700;
text-align:center;
background:linear-gradient(
270deg,
#f00,
#ff7f00,
#ff0,
#0f0,
#00f,
#4b0082,
#8f00ff
);
background-size:400% 400%;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 3s ease infinite
}

#error-text{
position:fixed;
z-index:10000;
left:50%;
bottom:25px;
width:90%;
transform:translateX(-50%);
color:#f33;
font-family:monospace;
font-size:14px;
text-align:center;
white-space:pre-wrap
}

@keyframes rainbow{
0%{background-position:0 50%}
50%{background-position:100% 50%}
100%{background-position:0 50%}
}
</style>
</head>

<body>

<div id="unity-container">
<canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="loading-text">LOADING... 0%</div>
<div id="error-text"></div>

<script>
(function(){

"use strict";

var a=document.getElementById("unity-canvas"),
b=document.getElementById("loading-text"),
c=document.getElementById("error-text");

var d="https://nobrowebport.github.io/S3OnlinePort/",
e="https://media.githubusercontent.com/media/nobrowebport/S3OnlinePort/main/";

var f={
dataUrl:e+"S3WebGL.data",
frameworkUrl:d+"S3WebGL.framework.js",
codeUrl:d+"S3WebGL.wasm",
streamingAssetsUrl:"StreamingAssets",
companyName:"DefaultCompany",
productName:"Slendytubbies 3",
productVersion:"1.0"
};

var g=document.createElement("script");

g.src=d+"S3WebGL.loader.js";

g.onload=function(){

console.log("[S3] loader ready");

if(typeof createUnityInstance!=="function"){

b.textContent="UNITY LOADER ERROR";
c.textContent="Unity initialization function unavailable.";

return;
}

createUnityInstance(
a,
f,
function(h){

var i=Math.round(h*100);

b.textContent="LOADING... "+i+"%";

}
)

.then(function(j){

window.unityInstance=j;

b.remove();

c.textContent="";

console.log("[S3] game ready");

})

.catch(function(k){

console.error("[S3] startup failed:",k);

b.textContent="FAILED TO LOAD";
c.textContent=String(k);

});

};

g.onerror=function(){

console.error("[S3] loader failed");

b.textContent="FAILED TO LOAD LOADER";
c.textContent="Unable to load Unity loader.";

};

document.body.appendChild(g);

})();
</script>

</body>
</html>
